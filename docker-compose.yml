services:
  db:
    image: postgres:17
    container_name: geographic-db
    environment:
      POSTGRES_DB: ${DB_NAME:-geographic}
      POSTGRES_USER: ${DB_USER:-geographic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geographic}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - geographic-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geographic} -d ${DB_NAME:-geographic}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  geographic-db-data:
